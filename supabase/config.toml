# Describes the LOCAL stack only -- the one `supabase start` brings up for the test
# suite. It is committed, so nothing secret belongs here.
#
# Production is a separate Supabase Cloud project reached with `supabase db push`. None
# of the settings below are pushed to it: `db push` sends migrations and nothing else, so
# the Cloud project's auth and extension settings are dashboard work. See README.md.
project_id = "vendor-app"

[api]
enabled = true
# 55321/55322 rather than the default 54321/54322, so this stack can run alongside
# another local Supabase project without colliding.
port = 55321
schemas = ["public"]

[db]
port = 55322
# Matches production, which runs Postgres 17.6. Tests that pass on a different major are
# not evidence about the engine this ships on. Changing this needs `supabase stop` and
# `supabase start` to reprovision the container.
major_version = 17

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
# Tests sign up real users and need a session immediately. With confirmations on,
# signUp returns { session: null } and every downstream assertion fails on a null token.
# This is a LOCAL convenience: production keeps confirmations on.
enable_confirmations = false

# verify_jwt rejects unauthenticated calls at the platform edge. That is defence in depth,
# NOT the check: a valid token proves a signed-in user, not an admin. The function reads
# app_users under the caller's own JWT to decide that, and must keep doing so.
[functions.admin-create-user]
verify_jwt = true
