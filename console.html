<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vendor App — Console</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html { font-size: 13px; }
  body { background: #f6f8fb; font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; color: #334155; }
  ::-webkit-scrollbar { height: 8px; width: 8px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  .nm { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; box-shadow: 0 1px 2px rgba(15,23,42,.04); }
  .nm-inset { background: #fff; border: 1px solid #d3dce6; border-radius: 8px; transition: border-color .12s, box-shadow .12s; }
  .nm-inset:focus, .nm-inset:focus-within { border-color: #16a34a; box-shadow: 0 0 0 3px rgba(22,163,74,.12); outline: none; }
  .nm-btn { background: #fff; border: 1px solid #d3dce6; border-radius: 8px; transition: background .12s; }
  .nm-btn:hover { background: #f1f5f9; }
  .grad { background: #16a34a; border-radius: 8px; }
  .grad:hover { background: #15803d; }
  .grad:disabled { background: #86efac; cursor: not-allowed; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
/* ============================================================================
 * Vendor App — staff console
 *
 * A single-file admin console for the database foundation. There is NO server
 * of ours: this talks straight to PostgREST and GoTrue, and every read and
 * write below is subject to the RLS policies in supabase/migrations/0002_rls.sql.
 * If a query here returns nothing, that is a policy doing its job, not a bug to
 * work around client-side.
 *
 * The anon key is public by design. It grants the `anon` role and nothing more;
 * what any signed-in user may see is decided in the database, per vendor and
 * per role. Never put the service_role key in this file.
 *
 * SCOPE: sign-in, the eight dashboard views, and item administration. The
 * billing flow (issue_token / complete_bill) is deliberately not here yet.
 * This console is a working tool, not slice 3 -- docs/design.md specifies a
 * React + Vite + TypeScript SPA in web/ for the real app, because a single file
 * gets painful once mr/hi/en i18n lands.
 * ========================================================================== */

const SUPABASE_URL = "https://cnnqidkmcxkgwxnulvig.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNubnFpZGttY3hrZ3d4bnVsdmlnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4MzgxOTUsImV4cCI6MjEwNDQxNDE5NX0.tSZv1HuVpDFzdcXiio_EIZPt-8cY6m8qJCPmc5oclOo";

const { useState, useEffect, useCallback } = React;
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const money = (n) => "₹" + Number(n ?? 0).toLocaleString("en-IN", { maximumFractionDigits: 2 });
const kg = (n) => Number(n ?? 0).toLocaleString("en-IN", { maximumFractionDigits: 3 }) + " kg";

/* ---------------------------------------------------------------- primitives */

function Card({ title, subtitle, children, right }) {
  return (
    <div className="nm p-4">
      <div className="flex items-start justify-between gap-3 mb-3">
        <div>
          <h2 className="font-semibold text-slate-800">{title}</h2>
          {subtitle && <p className="text-xs text-slate-500 mt-0.5">{subtitle}</p>}
        </div>
        {right}
      </div>
      {children}
    </div>
  );
}

// An empty result is the norm here, not an error: a brand-new vendor has no
// bills, and RLS filters anything belonging to someone else. Saying so plainly
// beats an empty table that reads like a broken query.
function Empty({ children }) {
  return <p className="text-xs text-slate-400 italic py-3">{children}</p>;
}

function Table({ columns, rows, render, empty }) {
  if (!rows) return <p className="text-xs text-slate-400 py-3">Loading…</p>;
  if (!rows.length) return <Empty>{empty}</Empty>;
  return (
    <div className="overflow-x-auto -mx-1">
      <table className="w-full text-left">
        <thead>
          <tr className="text-[11px] uppercase tracking-wide text-slate-400">
            {columns.map((c) => <th key={c} className="font-medium px-1 pb-2">{c}</th>)}
          </tr>
        </thead>
        <tbody className="divide-y divide-slate-100">{rows.map(render)}</tbody>
      </table>
    </div>
  );
}

function Err({ error }) {
  if (!error) return null;
  return (
    <div className="rounded-lg border border-rose-200 bg-rose-50 px-3 py-2 text-xs text-rose-700 mb-3">
      {error}
    </div>
  );
}

/* --------------------------------------------------------------------- login */

function Login({ onIn }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);

  async function submit(e) {
    e.preventDefault();
    setBusy(true); setError(null);
    const { error } = await db.auth.signInWithPassword({ email, password });
    setBusy(false);
    if (error) setError(error.message); else onIn();
  }

  return (
    <div className="min-h-screen flex items-center justify-center p-4">
      <form onSubmit={submit} className="nm p-6 w-full max-w-sm">
        <h1 className="text-lg font-semibold text-slate-800">Vendor App</h1>
        <p className="text-xs text-slate-500 mt-1 mb-5">Staff sign-in</p>
        <Err error={error} />
        <label className="block text-xs font-medium text-slate-600 mb-1">Email</label>
        <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)}
               className="nm-inset w-full px-3 py-2 mb-3" autoComplete="username" />
        <label className="block text-xs font-medium text-slate-600 mb-1">Password</label>
        <input type="password" required value={password} onChange={(e) => setPassword(e.target.value)}
               className="nm-inset w-full px-3 py-2 mb-5" autoComplete="current-password" />
        <button type="submit" disabled={busy}
                className="grad w-full text-white font-medium py-2">
          {busy ? "Signing in…" : "Sign in"}
        </button>
      </form>
    </div>
  );
}

/* ---------------------------------------------------------------- dashboards */

function Dashboards() {
  const [d, setD] = useState({});

  useEffect(() => {
    // Each view is security_invoker, so these come back already scoped to the
    // caller's vendor -- there is no vendor_id filter to write here, and adding
    // one would be a second, weaker copy of the policy.
    const views = [
      ["daily", "v_payments_daily"], ["weekly", "v_payments_weekly"],
      ["monthly", "v_payments_monthly"], ["top", "v_top_items"],
      ["together", "v_bought_together"], ["low", "v_low_stock"],
      ["inStock", "v_in_stock"], ["requests", "v_stock_request_counts"],
    ];
    Promise.all(views.map(async ([key, view]) => {
      const { data, error } = await db.from(view).select("*").limit(20);
      return [key, error ? { error: error.message } : { rows: data }];
    })).then((entries) => setD(Object.fromEntries(entries)));
  }, []);

  const cell = "px-1 py-1.5 text-slate-700";
  const part = (k) => d[k]?.rows;
  const cols = (k) => (d[k]?.rows?.length ? Object.keys(d[k].rows[0]) : []);

  // The views' shapes live in 0004_views.sql and may change; rendering their
  // actual columns keeps this honest rather than silently dropping a new one.
  const Generic = ({ k, title, subtitle, empty }) => (
    <Card title={title} subtitle={subtitle}>
      <Err error={d[k]?.error} />
      <Table
        columns={cols(k)}
        rows={part(k)}
        empty={empty}
        render={(row, i) => (
          <tr key={i}>
            {Object.entries(row).map(([c, v]) => (
              <td key={c} className={cell}>
                {c.includes("total") || c.includes("amount") || c.includes("payment") ? money(v)
                  : c.includes("kg") || c.includes("qty") ? kg(v)
                  : String(v ?? "—")}
              </td>
            ))}
          </tr>
        )}
      />
    </Card>
  );

  return (
    <div className="grid gap-4 md:grid-cols-2">
      <Generic k="daily" title="Payments — daily" subtitle="Completed bills only" empty="No completed bills yet." />
      <Generic k="weekly" title="Payments — weekly" empty="No completed bills yet." />
      <Generic k="monthly" title="Payments — monthly" empty="No completed bills yet." />
      <Generic k="top" title="Top items" subtitle="Ranked by quantity sold" empty="Nothing sold yet." />
      <Generic k="together" title="Bought together" subtitle="Pairs seen 3+ times" empty="Not enough sales to find pairs." />
      <Generic k="low" title="Low stock" subtitle="Under 10 kg" empty="Nothing is low." />
      <Generic k="inStock" title="In stock" subtitle="Above 0 kg" empty="No items in stock." />
      <Generic k="requests" title="Stock requests" subtitle="Grouped by item name" empty="No customer requests." />
    </div>
  );
}

/* -------------------------------------------------------------------- items */

function Items({ role, vendorId }) {
  const [rows, setRows] = useState(null);
  const [error, setError] = useState(null);
  const [form, setForm] = useState({ name_en: "", price: "", stock_kg: "" });
  const [busy, setBusy] = useState(false);

  // Only admin may write items (0002_rls.sql: items_admin_write). The UI hides
  // the controls, but the database is what enforces it -- a recorder poking at
  // the console still gets refused.
  const canWrite = role === "admin";

  const load = useCallback(async () => {
    const { data, error } = await db.from("items").select("*").order("name_en");
    if (error) setError(error.message); else { setRows(data); setError(null); }
  }, []);

  useEffect(() => { load(); }, [load]);

  async function add(e) {
    e.preventDefault();
    setBusy(true); setError(null);
    // vendor_id must be sent: the column is NOT NULL with no default. Sending it is
    // safe rather than a trust hole -- the insert policy's WITH CHECK requires it to
    // equal current_vendor_id(), so a forged value is refused by the database.
    const { error } = await db.from("items").insert({
      vendor_id: vendorId,
      name_en: form.name_en,
      price: Number(form.price),
      stock_kg: Number(form.stock_kg || 0),
    });
    setBusy(false);
    if (error) setError(error.message);
    else { setForm({ name_en: "", price: "", stock_kg: "" }); load(); }
  }

  async function patch(id, field, value) {
    const { error } = await db.from("items").update({ [field]: Number(value) }).eq("id", id);
    if (error) setError(error.message); else load();
  }

  return (
    <Card title="Items" subtitle={canWrite ? "Prices and stock — admin only" : "Read-only for your role"}>
      <Err error={error} />
      {canWrite && (
        <form onSubmit={add} className="flex flex-wrap gap-2 mb-4">
          <input required placeholder="Item name" value={form.name_en}
                 onChange={(e) => setForm({ ...form, name_en: e.target.value })}
                 className="nm-inset px-3 py-1.5 flex-1 min-w-[10rem]" />
          <input required type="number" step="0.01" min="0" placeholder="Price ₹" value={form.price}
                 onChange={(e) => setForm({ ...form, price: e.target.value })}
                 className="nm-inset px-3 py-1.5 w-28" />
          <input type="number" step="0.001" min="0" placeholder="Stock kg" value={form.stock_kg}
                 onChange={(e) => setForm({ ...form, stock_kg: e.target.value })}
                 className="nm-inset px-3 py-1.5 w-28" />
          <button disabled={busy} className="grad text-white px-4 py-1.5 font-medium">Add</button>
        </form>
      )}
      <Table
        columns={canWrite ? ["Item", "Price", "Stock", ""] : ["Item", "Price", "Stock"]}
        rows={rows}
        empty="No items yet. Add the first one above."
        render={(it) => (
          <tr key={it.id}>
            <td className="px-1 py-2 text-slate-800">{it.name_en}</td>
            <td className="px-1 py-2">{money(it.price)}</td>
            <td className="px-1 py-2">
              <span className={Number(it.stock_kg) < 10 ? "text-amber-600 font-medium" : ""}>{kg(it.stock_kg)}</span>
            </td>
            {canWrite && (
              <td className="px-1 py-2">
                <div className="flex gap-1">
                  <button className="nm-btn px-2 py-1 text-xs"
                          onClick={() => {
                            const v = prompt(`New price for ${it.name_en}`, it.price);
                            if (v !== null && v !== "") patch(it.id, "price", v);
                          }}>Price</button>
                  <button className="nm-btn px-2 py-1 text-xs"
                          onClick={() => {
                            const v = prompt(`New stock (kg) for ${it.name_en}`, it.stock_kg);
                            if (v !== null && v !== "") patch(it.id, "stock_kg", v);
                          }}>Stock</button>
                </div>
              </td>
            )}
          </tr>
        )}
      />
    </Card>
  );
}

/* ---------------------------------------------------------------------- app */

function App() {
  const [session, setSession] = useState(undefined); // undefined = still checking
  const [me, setMe] = useState(null);
  const [tab, setTab] = useState("dashboards");
  const [error, setError] = useState(null);

  useEffect(() => {
    db.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: sub } = db.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => sub.subscription.unsubscribe();
  }, []);

  useEffect(() => {
    if (!session) { setMe(null); return; }
    // app_users is readable within the tenant; this row is what current_vendor_id()
    // and current_user_role() resolve from. No row here means the account exists in
    // Auth but was never mapped to a vendor -- worth saying explicitly, because
    // everything else would just silently come back empty.
    (async () => {
      const { data, error } = await db
        .from("app_users").select("name, role, vendor_id, vendors(name)")
        .eq("id", session.user.id).maybeSingle();
      if (error) setError(error.message);
      else if (!data) setError(
        "Signed in, but this account is not mapped to a vendor. An admin must add a row " +
        "in app_users — see docs/runbook-first-admin.md."
      );
      else { setMe(data); setError(null); }
    })();
  }, [session]);

  if (session === undefined) return <div className="p-8 text-slate-400">Loading…</div>;
  if (!session) return <Login onIn={() => {}} />;

  return (
    <div className="min-h-screen">
      <header className="nm rounded-none border-x-0 border-t-0 px-4 py-3 mb-4">
        <div className="max-w-6xl mx-auto flex items-center justify-between gap-3">
          <div>
            <h1 className="font-semibold text-slate-800">{me?.vendors?.name || "Vendor App"}</h1>
            <p className="text-xs text-slate-500">
              {me ? `${me.name} · ${me.role}` : session.user.email}
            </p>
          </div>
          <button className="nm-btn px-3 py-1.5 text-xs"
                  onClick={() => db.auth.signOut()}>Sign out</button>
        </div>
      </header>

      <main className="max-w-6xl mx-auto px-4 pb-10">
        <Err error={error} />
        {me && (
          <>
            <nav className="flex gap-2 mb-4">
              {[["dashboards", "Dashboards"], ["items", "Items"]].map(([k, label]) => (
                <button key={k} onClick={() => setTab(k)}
                        className={`px-3 py-1.5 text-xs font-medium rounded-lg ${
                          tab === k ? "grad text-white" : "nm-btn"}`}>{label}</button>
              ))}
            </nav>
            {tab === "dashboards" ? <Dashboards /> : <Items role={me.role} vendorId={me.vendor_id} />}
          </>
        )}
      </main>

      <footer className="max-w-6xl mx-auto px-4 pb-8 text-[11px] text-slate-400">
        Billing (token issue and bill completion) is not in this console yet — see
        docs/design.md, slice 3.
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
